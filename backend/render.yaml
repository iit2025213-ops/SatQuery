# render.yaml - Deployment configuration for Render

services:
  - type: web
    name: satquery-backend
    env: python
    
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      
      - key: BACKEND_URL
        scope: build
        sync: false
      
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      
      - key: JWT_SECRET_KEY
        sync: false
      
      - key: OPENAI_API_KEY
        sync: false
      
      - key: AI_BRAIN_URL
        sync: false
      
      - key: LOG_LEVEL
        value: INFO
      
      - key: DEBUG
        value: false
    
    healthCheckPath: /health
    
    disk:
      name: satquery-data
      mountPath: /var/data
      sizeGB: 10
